<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NBA Playoffs" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <title>NBA Playoffs</title>
    <script>
      (() => {
        const storageKey = "theme_preference";
        const root = document.documentElement;
        const themeColorMetas = document.querySelectorAll('meta[name="theme-color"]');
        const savedTheme = window.localStorage.getItem(storageKey);
        const theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";

        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;

        // When user manually picks a theme, override both meta tags
        const color = theme === "dark" ? "#020817" : "#0a1628";
        themeColorMetas.forEach((meta) => meta.setAttribute("content", color));
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
